services:
  # ----------------------------------------------------
  # 1. APPLICATION DATA STORES
  # ----------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: arc-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./.containers_data/postgres:/var/lib/postgresql/data
    networks:
      - arc-network
    restart: always

  # ----------------------------------------------------
  # 2. VECTOR STORAGE INFRASTRUCTURE
  # ----------------------------------------------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.0
    container_name: milvus-etcd
    command: etcd -advertise-client-urls http://0.0.0.0:2379 -listen-client-urls http://0.0.0.0:2379
    ports:
      - "2379:2379"
    volumes:
      - ./.containers_data/milvus/etcd:/etcd
    networks:
      - arc-network

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: milvus-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /minio_data
    ports:
      - "9000:9000"
    volumes:
      - ./.containers_data/milvus/minio:/minio_data
    networks:
      - arc-network

  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: milvus
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_ENDPOINTS: ${ETCD_ENDPOINTS}
      MINIO_ADDRESS: ${MINIO_ADDRESS}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    depends_on:
      - etcd
      - minio
    volumes:
      - ./.containers_data/milvus/milvus:/var/lib/milvus
    networks:
      - arc-network
    restart: always

  # ----------------------------------------------------
  # 3. KAFKA
  # ----------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: arc-zookeeper

    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT}
      ZOOKEEPER_TICK_TIME: ${ZOOKEEPER_TICK_TIME}

    ports:
      - "2181:2181"

    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log

    healthcheck:    
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep Mode"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
      
    networks:
      - arc-network

  arc-kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: arc-kafka

    restart: unless-stopped

    depends_on:
      zookeeper:
        condition: service_healthy

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID}
      KAFKA_ZOOKEEPER_CONNECT: ${KAFKA_ZOOKEEPER_CONNECT}
      KAFKA_LISTENERS: ${KAFKA_LISTENERS}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - arc-network

  # ----------------------------------------------------
  # 4. AI SERVICE
  # ----------------------------------------------------
  ai-service:
    build:
      context: ./ai-service
    container_name: arc-ai-service
    ports:
      - "8000:8000"
    environment:
      MILVUS_HOST: ${MILVUS_HOST}
      MILVUS_PORT: ${MILVUS_PORT}
      MILVUS_COLLECTION_NAME: ${MILVUS_COLLECTION_NAME}
      VECTOR_DIM: ${VECTOR_DIM}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_INDEX_TOPIC: ${KAFKA_INDEX_TOPIC}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LOCAL_EMBEDDING_MODEL_PATH: ${LOCAL_EMBEDDING_MODEL_PATH}
      ONNX_MODEL_PATH: ${ONNX_MODEL_PATH}
      RETRIEVAL_MIN_SCORE: ${RETRIEVAL_MIN_SCORE}
      RETRIEVAL_MAX_TOKENS: ${RETRIEVAL_MAX_TOKENS}      
    depends_on:
      - milvus
      - arc-kafka
    volumes:
      - ./ai-service:/app
      - ./models/bge-m3:/models/bge-m3:ro
    networks:
      - arc-network
    restart: on-failure

  # ----------------------------------------------------
  # 5. SPRING BOOT
  # ----------------------------------------------------
  backend-java:
    build:
      context: ./backend-java
    container_name: arc-backend-java
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
      SETTINGS_PATHS_STORAGE_PATH: ${SETTINGS_PATHS_STORAGE_PATH}
      SETTINGS_PATHS_ASK_GENERATIVE_AI_URL: ${SETTINGS_PATHS_ASK_GENERATIVE_AI_URL}
    depends_on:
      - postgres
      - arc-kafka
      - ai-service
    volumes:
      - ./ARC-Repositories:/app/storage
    networks:
      - arc-network
    restart: on-failure

  # ----------------------------------------------------
  # 6. FRONTEND
  # ----------------------------------------------------
  arc-studio:
    build:
      context: ./arc-studio
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: arc-studio-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend-java
    networks:
      - arc-network
    restart: always

networks:
  arc-network:
    driver: bridge

volumes:
  kafka-data:
  zookeeper-data:
  zookeeper-log: