version: '3.8'

services:
  # ----------------------------------------------------
  # 1. APPLICATION DATA STORES (Stored inside ARC Folder)
  # ----------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: arc-postgres
    environment:
      POSTGRES_DB: arc_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sole@2006
    ports:
      - "5432:5432"
    volumes:
      - ./.containers_data/postgres:/var/lib/postgresql/data
    networks:
      - arc-network
    restart: always

  # ----------------------------------------------------
  # 2. VECTOR STORAGE INFRASTRUCTURE (Milvus v2.4.0)
  # ----------------------------------------------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.0
    container_name: milvus-etcd
    command: etcd -advertise-client-urls http://0.0.0.0:2379 -listen-client-urls http://0.0.0.0:2379
    ports:
      - "2379:2379"
    volumes:
      - ./.containers_data/milvus/etcd:/etcd
    networks:
      - arc-network

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: milvus-minio
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    command: server /minio_data
    ports:
      - "9000:9000"
    volumes:
      - ./.containers_data/milvus/minio:/minio_data
    networks:
      - arc-network

  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: milvus
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on:
      - etcd
      - minio
    volumes:
      - ./.containers_data/milvus/milvus:/var/lib/milvus
    networks:
      - arc-network
    restart: always

  # ----------------------------------------------------
  # 3. MESSAGE BROKER STREAMING INTERFACE (Kafka v7.5.0)
  # ----------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: arc-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - ./.containers_data/zookeeper:/var/lib/zookeeper
    networks:
      - arc-network

  arc-kafka:  # Changed service key to arc-kafka for perfect matching
    image: confluentinc/cp-kafka:7.5.0
    container_name: arc-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Added KAFKA_LISTENERS so Kafka binds to these ports inside the container
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://arc-kafka:29092,EXTERNAL://localhost:9092
      # Fixed the maps to match INTERNAL and EXTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - ./.containers_data/kafka:/var/lib/kafka/data
    networks:
      - arc-network

  # ----------------------------------------------------
  # 4. APPLICATION SERVICES ENVIRONMENT
  # ----------------------------------------------------
  ai-service:
    build:
      context: ./ai-service
    container_name: arc-ai-service
    ports:
      - "8000:8000"    
    environment:
      - MILVUS_HOST=${MILVUS_HOST:-milvus}
      - MILVUS_PORT=${MILVUS_PORT:-19530}
      - MILVUS_COLLECTION_NAME=${MILVUS_COLLECTION_NAME:-ims_embeddings}
      - VECTOR_DIM=${VECTOR_DIM:-1024}
      # Updated default server address to arc-kafka
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-arc-kafka:29092}
      - KAFKA_INDEX_TOPIC=${KAFKA_INDEX_TOPIC:-arc.index}
      - KAFKA_CONSUMER_GROUP=${KAFKA_CONSUMER_GROUP:-arc-consumer-group}
      - GEMINI_API_KEY=${GEMINI_API_KEY} 
      - EMBEDDING_MODEL_PATH=/models/bge-m3
      - RETRIEVAL_MIN_SCORE=${RETRIEVAL_MIN_SCORE:-0.30}
      - RETRIEVAL_MAX_TOKENS=${RETRIEVAL_MAX_TOKENS:-4000}
    depends_on:
      - milvus
      - arc-kafka  # Updated dependency name
    volumes:
      - ./ai-service:/app
      - C:\Models\bge-m3:/models/bge-m3
    networks:
      - arc-network
    restart: on-failure

  backend-java:
    build:
      context: ./backend-java
    container_name: arc-backend-java
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/arc_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=sole@2006
      # Updated server address to arc-kafka
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=arc-kafka:29092
      - SETTINGS_PATHS_STORAGE_PATH=/app/storage
      - SETTINGS_PATHS_ASK_GENERATIVE_AI_URL=http://ai-service:8000/generate/api
    depends_on:
      - postgres
      - arc-kafka  # Updated dependency name
      - ai-service
    volumes:
      - ./ARC-Repositories:/app/storage
    networks:
      - arc-network
    restart: on-failure

  arc-studio:
    build:
      context: ./arc-studio
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: arc-studio-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      - backend-java
    networks:
      - arc-network
    restart: always

networks:
  arc-network:
    driver: bridge